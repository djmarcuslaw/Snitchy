# Automated checks, run by GitHub on every push.
#
#  * unit-tests:   the parser/tracker/database/web tests on Linux (fast)
#  * macos-live:   on a real Mac in GitHub's cloud: run the unit tests,
#                  then do a REAL capture with Apple's pktap and check that a
#                  `curl` to example.com shows up with the right app, hostname
#                  and Apple signature.
#  * brew-install: install Snitchy the way you would (Homebrew +
#                  `sudo snitchy install-service`), then check the service
#                  runs from root-owned files with Apple's Python, the
#                  dashboard is locked until you sign in, and it sees traffic.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python3 -m unittest discover -s tests -v

  macos-live:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Unit tests on macOS
        run: python3 -m unittest discover -s tests -v
      - name: Unit tests with Apple's Python (what the service runs on)
        run: /usr/bin/python3 -m unittest discover -s tests
      - name: Live capture
        run: |
          sudo python3 -m snitchy selftest --seconds 20 > rows.jsonl 2> selftest.log &
          sleep 5
          curl -s -o /dev/null https://example.com
          curl -s -o /dev/null http://neverssl.com || true
          wait
          cat selftest.log
          echo "---- captured connections ----"
          cat rows.jsonl
      - name: Check the capture found curl -> example.com
        run: python3 .github/check_selftest.py rows.jsonl

  brew-install:
    runs-on: macos-15
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@v5
      - name: Install from a local tap (pointed at this commit's branch)
        run: |
          BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          brew tap-new --no-git local/snitchy
          TAP="$(brew --repository)/Library/Taps/local/homebrew-snitchy"
          sed "s|branch: \"main\"|branch: \"$BRANCH\"|" Formula/snitchy.rb > "$TAP/Formula/snitchy.rb"
          brew install --HEAD local/snitchy/snitchy
          brew test local/snitchy/snitchy
      - name: Install the background service
        run: sudo snitchy install-service
      - name: Service runs from root-owned files with Apple's Python
        run: |
          sleep 3
          ls -la /Library/Snitchy /Library/Snitchy/app/snitchy | head -20
          test "$(stat -f %u /Library/Snitchy/app/snitchy/cli.py)" = 0
          test -z "$(find /Library/Snitchy/app -perm -g+w -o -perm -o+w)"
          ps -axo user,command | grep "[l]aunch.py run" | tee ps.txt
          grep -q "Python3.framework" ps.txt   # Apple's Python (Command Line Tools or Xcode)
          if grep -q homebrew ps.txt; then echo "service is running Homebrew code"; exit 1; fi
          sudo stat -f "%Sp %Su" "/Library/Application Support/Snitchy" | tee perms.txt
          grep -q "^drwx------ nobody" perms.txt
      - name: Dashboard is locked until signed in, and sees traffic
        run: |
          for i in $(seq 1 30); do curl -s -o /dev/null localhost:8899/ && break; sleep 1; done
          code=$(curl -s -o /dev/null -w "%{http_code}" localhost:8899/api/connections)
          echo "without sign-in: $code"; test "$code" = 401
          curl -s -o /dev/null https://example.com
          sleep 4
          TOKEN=$(sudo cat /Library/Snitchy/dashboard-token)
          curl -s -c jar.txt -o /dev/null "localhost:8899/login?token=$TOKEN"
          curl -s -b jar.txt "localhost:8899/api/connections?q=example.com" | tee conns.json
          echo
          python3 -c "import json,sys; rows=json.load(open('conns.json'))['rows']; sys.exit(0 if rows else 'no example.com connection in the dashboard API')"
      - name: Service log
        if: always()
        run: |
          sudo cat /Library/Logs/Snitchy.log || true
          sudo snitchy uninstall-service
          test ! -e /Library/Snitchy
